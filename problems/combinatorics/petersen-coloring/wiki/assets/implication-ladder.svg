<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
  <title id="title">The Petersen coloring implication ladder after the 2026 disproof</title>
  <desc id="desc">The Petersen coloring conjecture (false since August 2026) implied Berge-Fulkerson, hence Berge and Fan-Raspaud, and the 5-cycle double cover conjecture. Every lower conjecture holds on the three retrievable counterexamples, with the audited values.</desc>
  <style>
    .box { fill: #f4f6fa; stroke: #2b3a55; stroke-width: 1.5; }
    .dead { fill: #fdecec; stroke: #a33; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .ok { fill: #e9f5ee; stroke: #2a7a4b; stroke-width: 1.5; }
    .txt { font: 14px system-ui, sans-serif; fill: #1b2430; }
    .small { font: 12px system-ui, sans-serif; fill: #3a4657; }
    .arrow { stroke: #2b3a55; stroke-width: 1.5; fill: none; marker-end: url(#head); }
    @media (prefers-color-scheme: dark) {
      .box { fill: #1e2633; stroke: #b9c4d6; }
      .dead { fill: #3a1f1f; stroke: #e08a8a; }
      .ok { fill: #1f3327; stroke: #8fd3a8; }
      .txt { fill: #e6ebf2; }
      .small { fill: #b9c4d6; }
      .arrow { stroke: #b9c4d6; }
    }
  </style>
  <defs>
    <marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" style="fill:#2b3a55"/>
    </marker>
  </defs>

  <rect class="dead" x="230" y="20" width="300" height="60" rx="8"/>
  <text class="txt" x="380" y="45" text-anchor="middle">Petersen coloring conjecture (Jaeger 1988)</text>
  <text class="small" x="380" y="66" text-anchor="middle">FALSE: 112, 68, 52 vertices (August 2026)</text>

  <path class="arrow" d="M300,80 L180,140"/>
  <path class="arrow" d="M460,80 L580,140"/>

  <rect class="ok" x="40" y="140" width="280" height="56" rx="8"/>
  <text class="txt" x="180" y="163" text-anchor="middle">Berge-Fulkerson (6 perfect matchings)</text>
  <text class="small" x="180" y="183" text-anchor="middle">holds on G112, H112, G52 (explicit covers)</text>

  <rect class="ok" x="440" y="140" width="280" height="56" rx="8"/>
  <text class="txt" x="580" y="163" text-anchor="middle">5-cycle double cover</text>
  <text class="small" x="580" y="183" text-anchor="middle">holds on G112, H112, G52 (explicit covers)</text>

  <path class="arrow" d="M120,196 L120,250"/>
  <path class="arrow" d="M240,196 L240,250"/>
  <path class="arrow" d="M580,196 L580,250"/>

  <rect class="ok" x="30" y="250" width="180" height="56" rx="8"/>
  <text class="txt" x="120" y="273" text-anchor="middle">Berge (index at most 5)</text>
  <text class="small" x="120" y="293" text-anchor="middle">index is 4 on all three</text>

  <rect class="ok" x="230" y="250" width="180" height="56" rx="8"/>
  <text class="txt" x="320" y="273" text-anchor="middle">Fan-Raspaud triple</text>
  <text class="small" x="320" y="293" text-anchor="middle">holds on all three</text>

  <rect class="ok" x="440" y="250" width="280" height="56" rx="8"/>
  <text class="txt" x="580" y="273" text-anchor="middle">Cycle double cover</text>
  <text class="small" x="580" y="293" text-anchor="middle">a 5-cover is in particular a cover</text>

  <rect class="box" x="40" y="340" width="680" height="56" rx="8"/>
  <text class="txt" x="380" y="363" text-anchor="middle">Audited on the same graphs: nowhere-zero 5-flow yes, 4-flow no; oddness 4, 4, 2; resistance 3, 3, 2</text>
  <text class="small" x="380" y="383" text-anchor="middle">Every yes is a re-verified witness; every no and every lower bound is a checked DRAT proof (EXP-001 to EXP-003)</text>
</svg>
